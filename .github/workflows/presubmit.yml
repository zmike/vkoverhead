name: Presubmit
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install dependencies
        shell: bash
        run: |
          set -x
          sudo apt install \
            ninja-build \
            meson-1.5 \
            python3-mako
      - name: Meson setup
        shell: bash
        run: |
          set -x
          meson setup build .
      - name: Meson build
        shell: bash
        run: |
          set -x
          meson compile -C build
